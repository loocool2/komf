name: Build & Release

on:
  push:
    tags:
      # upstream komf tags are bare semver (1.7.1), no "v" prefix
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.8.0)'
        required: true

permissions:
  contents: write   # create the release
  packages: write   # push to ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # komf-api-models applies the Android library plugin, so the build
      # needs an Android SDK with platform 36 available at configure time.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: ver
        run: echo "version=${{ github.event.inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Build shadow jar
        run: ./gradlew --no-daemon -PkomfVersion=${{ steps.ver.outputs.version }} :komf-app:shadowJar

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.version }}
          # Snd-R writes release notes by hand — publish from the Releases tab
          # once you've edited them. Set to false to publish immediately.
          draft: true
          generate_release_notes: true
          files: komf-app/build/libs/komf-${{ steps.ver.outputs.version }}.jar

      # ---- Docker image: ghcr.io/loocool2/komf ----

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # add linux/arm/v7 if you need 32-bit ARM — the Dockerfile has a base
          # for it, but emulated builds are slow
          platforms: linux/amd64,linux/arm64
          build-args: |
            KOMF_VERSION=${{ steps.ver.outputs.version }}
          tags: |
            ghcr.io/loocool2/komf:${{ steps.ver.outputs.version }}
            ghcr.io/loocool2/komf:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
